[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bench"
version = "0.1.0"
description = "Benchmark local AI coding agents against local LLM backends."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "AI-Bench contributors"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
ai-bench = "ai_bench.cli:cli_main"
ai-bench-web = "ai_bench.web_cli:main"

[tool.setuptools]
packages = ["ai_bench"]
include-package-data = true

[tool.setuptools.package-data]
ai_bench = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
